---
apiVersion: memcached.c5c3.io/v1beta1
kind: Memcached
metadata:
  name: test-server-list
spec:
  replicas: 3
  image: "memcached:1.6"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  memcached:
    maxMemoryMB: 64
    threads: 4
