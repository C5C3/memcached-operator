---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: test-graceful
spec:
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  template:
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: memcached
          image: "memcached:1.6-alpine"
          lifecycle:
            preStop:
              exec:
                command:
                  - sleep
                  - "10"
