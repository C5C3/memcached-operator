---
suite: CRD template toggle
templates:
  - templates/crd-template.yaml
release:
  name: test-release
  namespace: test-ns
chart:
  appVersion: "0.7.0"
  version: "0.7.0"
tests:
  - it: should not render CRD when managedByHelm is false (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: should render CRD when managedByHelm is true
    set:
      crds.managedByHelm: true
    asserts:
      - hasDocuments:
          count: 1

  - it: should render CRD with correct kind and apiVersion
    set:
      crds.managedByHelm: true
    asserts:
      - isKind:
          of: CustomResourceDefinition
      - isAPIVersion:
          of: apiextensions.k8s.io/v1

  - it: should set CRD name to memcacheds.memcached.c5c3.io
    set:
      crds.managedByHelm: true
    asserts:
      - equal:
          path: metadata.name
          value: memcacheds.memcached.c5c3.io

  - it: should include standard Helm labels on CRD
    set:
      crds.managedByHelm: true
    asserts:
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: memcached-operator-0.7.0
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: memcached-operator
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: test-release
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "0.7.0"
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: should set correct CRD spec fields
    set:
      crds.managedByHelm: true
    asserts:
      - equal:
          path: spec.group
          value: memcached.c5c3.io
      - equal:
          path: spec.names.kind
          value: Memcached
      - equal:
          path: spec.names.plural
          value: memcacheds
      - equal:
          path: spec.scope
          value: Namespaced

  - it: should include status.serverList in both served versions
    set:
      crds.managedByHelm: true
    asserts:
      - exists:
          path: spec.versions[0].schema.openAPIV3Schema.properties.status.properties.serverList
      - exists:
          path: spec.versions[1].schema.openAPIV3Schema.properties.status.properties.serverList

  - it: should mark v1alpha1 as deprecated with a warning naming v1beta1
    set:
      crds.managedByHelm: true
    asserts:
      - equal:
          path: spec.versions[0].name
          value: v1alpha1
      - equal:
          path: spec.versions[0].deprecated
          value: true
      - equal:
          path: spec.versions[0].deprecationWarning
          value: "memcached.c5c3.io/v1alpha1 Memcached is deprecated; use memcached.c5c3.io/v1beta1 Memcached"
      - equal:
          path: spec.versions[1].name
          value: v1beta1
      - notExists:
          path: spec.versions[1].deprecated
